name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Pack PDF script
        working-directory: scripts/pdf
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match scripts/pdf/package.json version ${version}" >&2
            exit 1
          fi
          npm pack

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            .vscode/hugo-yore-media.code-snippets
            .vscode/hugo-yore-writing.code-snippets
            scripts/pdf/hugo-yore-pdf-*.tgz
