outputFormats:
  backlinks:
    mediaType: application/json
    baseName: backlinks
    isPlainText: true
    notAlternative: true
    weight: 1
  markdown:
    mediaType: text/markdown
    baseName: index
    rel: alternate
    isPlainText: true
  headers:
    mediaType: text/headers
    baseName: _headers
    isPlainText: true
    weight: 999
    notAlternative: true

mediaTypes:
  text/headers:
    # The file name is just "_headers", so no suffix or delimiter
    suffixes: ['']
    delimiter: ''

params:
  hkg:
    autoInjectJS: false
    autoInjectCSS: false
