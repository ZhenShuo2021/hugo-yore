<nav aria-label="{{ i18n `nav.breadcrumb` | default `Breadcrumb navigation` }}">
	<span aria-hidden="true">&#x276F;&nbsp;</span>
	{{- range $n, $page := .Ancestors.Reverse -}}
		{{- if eq $n 0 }}{{ continue }}{{ end -}}
		{{- if eq .Params.build.render "never" -}}
			<span>{{ $page.Title }}</span><span aria-hidden="true">&nbsp;/&nbsp;</span>
		{{- else -}}
			<a href="{{ $page.RelPermalink }}" class="hover:text-link-hover">{{ $page.Title }}</a>
			{{- /* trim space for nbsp */ -}}
			<span aria-hidden="true">&nbsp;/&nbsp;</span>
		{{- end -}}
	{{- end -}}
	<span aria-current="page">{{ .Title }}</span>
</nav>
