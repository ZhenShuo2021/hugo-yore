<button
	id="scroll-to-top"
	title="{{ i18n "nav.scroll_to_top_title" }}"
	aria-label="{{ i18n "nav.scroll_to_top_title" }}"
	class="bg-background hover:bg-muted text-foreground border-border pointer-events-none fixed right-3 bottom-4 z-50 flex h-10 w-10 items-center justify-center rounded-full border opacity-0 transition-all duration-(--dur-200) [&.visible]:pointer-events-auto [&.visible]:opacity-100">
	<span class="icon-arrow-up flex items-center justify-center" aria-hidden="true"></span>
</button>
