{{- $readingProgress := site.Params.readingProgress | default false }}
<div
	class="pointer-events-none invisible absolute top-0 left-0 h-12 w-1"
	id="scroll-sentinel"
	aria-hidden="true"></div>
{{- if $readingProgress }}
	<div
		id="scroll-progress"
		class="pointer-events-none fixed right-3 bottom-4 z-50 h-10 w-10 opacity-0 transition-all duration-(--dur-200) [&.visible]:pointer-events-auto [&.visible]:opacity-100">
		<!-- No fallback content inside <progress>, it is ignored by assistive technology -->
		<progress
			id="reading-progress"
			class="progress-ring"
			value="0"
			max="100"
			aria-label="{{ i18n "nav.reading_progress" }}"></progress>
		<button
			id="scroll-to-top"
			title="{{ i18n "nav.scroll_to_top_title" }}"
			aria-label="{{ i18n "nav.scroll_to_top_title" }}"
			class="bg-background hover:bg-muted text-foreground absolute inset-[1px] flex items-center justify-center rounded-full">
			<span class="icon-arrow-up flex items-center justify-center" aria-hidden="true"></span>
		</button>
	</div>
{{- else }}
	<button
		id="scroll-to-top"
		title="{{ i18n "nav.scroll_to_top_title" }}"
		aria-label="{{ i18n "nav.scroll_to_top_title" }}"
		class="bg-background hover:bg-muted text-foreground border-border pointer-events-none fixed right-3 bottom-4 z-50 flex h-10 w-10 items-center justify-center rounded-full border opacity-0 transition-all duration-(--dur-200) [&.visible]:pointer-events-auto [&.visible]:opacity-100">
		<span class="icon-arrow-up flex items-center justify-center" aria-hidden="true"></span>
	</button>
{{- end }}
