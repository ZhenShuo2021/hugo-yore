{{- $id := partial `lib/uid.html` . -}}
<div class="yr-translation relative flex" data-nav-item>
	<button
		type="button"
		class="text-foreground hover:text-link-hover -m-2 flex items-center p-2"
		aria-expanded="false"
		aria-controls="submenu-translations-{{ $id }}"
		data-dropdown-toggle>
		{{- partialCached "components/icon.html" "translate" "icon-translate" -}}
		<span class="sr-only">{{ i18n `nav.change_language` | default `Change language` }}</span>
	</button>

	<div
		id="submenu-translations-{{ $id }}"
		class="opacity-0 transition-opacity duration-(--dur-200)"
		data-dropdown-menu
		hidden>
		<div class="bg-background border-border min-w-32 overflow-hidden rounded-lg border shadow">
			<div class="flex max-h-[calc(100dvh-10rem)] flex-col gap-0.75 overflow-y-auto p-1">
				{{- range .AllTranslations -}}
					{{- $isCurrent := eq .Language.Lang $.Language.Lang -}}
					<a
						href="{{ .RelPermalink }}"
						class="text-popover-foreground {{ if $isCurrent -}}
							yr-header-active
						{{- end }} hover:text-link-hover hover:bg-muted flex items-center rounded p-1.5 text-sm whitespace-nowrap transition-colors"
						{{ if $isCurrent }}aria-current="true"{{ end }}>
						<bdi lang="{{ .Language.Lang }}">{{ .Language.Label | emojify }}</bdi>
					</a>
				{{- end -}}
			</div>
		</div>
	</div>
</div>
