{{- with .Rotate "version" -}}
	<div class="translation group relative">
		<button
			class="text-foreground hover:text-link-hover flex items-center gap-2"
			aria-label="{{ i18n `nav.switch_version` | default `Switch version` }}"
			aria-haspopup="listbox">
			{{- replace site.Version.Name "v" "" }}{{ partialCached "components/icon.html" "nav-arrow-down" "icon-nav-arrow-down" -}}
		</button>

		<div class="dropdown-menu-child absolute z-50 w-max" role="listbox" aria-label="Version">
			<div class="bg-background border-border rounded-lg border px-1 py-2 shadow-lg">
				<div class="flex flex-col">
					{{- range . -}}
						<a
							href="{{ .RelPermalink }}"
							role="option"
							class="text-popover-foreground {{ if eq .Site.Version.Name $.Site.Version.Name -}}
								header--active
							{{- end }} hover:text-link-hover hover:bg-muted flex items-center rounded px-4 py-2 text-sm whitespace-nowrap transition-colors"
							{{ if eq .Site.Version.Name $.Site.Version.Name }}
								aria-selected="true"
							{{ else }}
								aria-selected="false"
							{{ end }}
							title="{{ .Site.Version.Name }}">
							<span class="min-w-20">{{ .Site.Version.Name }}</span>
						</a>
					{{- end -}}
				</div>
			</div>
		</div>
	</div>
{{- end -}}
