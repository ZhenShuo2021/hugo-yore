{{- $img := .Store.Get "featuredImage" -}}
{{- $url := $img.url -}}

{{- if $url -}}
	<div class="page-hero--big my-1 mb-[5vh] w-full">
		<picture>
			{{ with $img.mobile }}<source media="(width < 768px)" srcset="{{ . }}" type="image/webp">{{ end }}
			{{ with $img.desktop }}<source media="(width >= 768px)" srcset="{{ . }}" type="image/webp">{{ end }}
			<img
				id="hero-image"
				src="{{ $url }}"
				{{ with $img.width }}width="{{ . }}"{{ end }}
				{{ with $img.height }}height="{{ . }}"{{ end }}
				loading="eager"
				decoding="async"
				fetchpriority="high"
				alt=""
				class="w-full">
		</picture>
	</div>
{{- end -}}
