<style>
	.yr-intro-accent {
		--ia-ink: #1c1b18;
		--ia-accent: #b8552f;
		--ia-line: color-mix(in oklab, #1c1b18 14%, transparent);
		--ia-surface: color-mix(in oklab, #1c1b18 4%, transparent);
	}
	html[data-theme='dark'] .yr-intro-accent {
		--ia-ink: #efece4;
		--ia-accent: #e08a5c;
		--ia-line: color-mix(in oklab, #efece4 14%, transparent);
		--ia-surface: color-mix(in oklab, #efece4 6%, transparent);
	}

	.yr-stack {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		margin: 1.25rem 0;
	}

	.yr-tag {
		position: relative;
		display: inline-flex;
		align-items: center;
		gap: 0.35rem;
		font-size: 0.82rem;
		padding: 0.4rem 0.7rem;
		border: 1px solid var(--ia-line);
		border-radius: 3px;
		text-decoration: none;
		color: var(--ia-ink);
		background: transparent;
		overflow: visible;
		isolation: isolate;
		transition:
			border-color 220ms ease,
			background-color 220ms ease,
			transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
	}

	.yr-tag:hover,
	.yr-tag:focus-visible {
		border-color: var(--yr-tool, var(--ia-accent));
		background: color-mix(in oklab, var(--yr-tool, var(--ia-accent)) 10%, var(--ia-surface));
	}

	.yr-tag:active {
		transform: translateY(0);
	}

	.yr-tag svg {
		width: 0.9rem;
		height: 0.9rem;
		flex: none;
		transition:
			transform 420ms cubic-bezier(0.34, 1.56, 0.64, 1),
			color 220ms ease;
	}

	.yr-tag:hover svg,
	.yr-tag:focus-visible svg {
		transform: scale(1.18) rotate(-8deg);
		color: var(--yr-tool, var(--ia-accent));
	}

	/* 彩色粒子迸出：每個 icon 旁邊放 4 顆小圓點，預設隱藏，hover 時各自飛散 */
	.yr-burst {
		position: absolute;
		top: 50%;
		left: 1.05rem;
		width: 0;
		height: 0;
		pointer-events: none;
	}

	.yr-burst i {
		position: absolute;
		top: 0;
		left: 0;
		width: 5px;
		height: 5px;
		border-radius: 50%;
		background: var(--yr-tool, var(--ia-accent));
		opacity: 0;
		transform: translate(-50%, -50%) scale(0.4);
	}

	.yr-tag:hover .yr-burst i,
	.yr-tag:focus-visible .yr-burst i {
		animation: yr-pop 620ms cubic-bezier(0.22, 0.78, 0.32, 1) forwards;
	}

	.yr-burst i:nth-child(1) {
		--dx: -16px;
		--dy: -14px;
		animation-delay: 0ms;
	}
	.yr-burst i:nth-child(2) {
		--dx: 14px;
		--dy: -16px;
		animation-delay: 30ms;
	}
	.yr-burst i:nth-child(3) {
		--dx: -12px;
		--dy: 14px;
		animation-delay: 60ms;
	}
	.yr-burst i:nth-child(4) {
		--dx: 15px;
		--dy: 12px;
		animation-delay: 15ms;
	}
	.yr-burst i:nth-child(5) {
		--dx: 0px;
		--dy: -19px;
		animation-delay: 45ms;
	}

	@keyframes yr-pop {
		0% {
			opacity: 0;
			transform: translate(-50%, -50%) scale(0.4);
		}
		35% {
			opacity: 1;
		}
		100% {
			opacity: 0;
			transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1);
		}
	}

	@media (prefers-reduced-motion: reduce) {
		.yr-tag,
		.yr-tag svg,
		.yr-burst i {
			transition: none !important;
			animation: none !important;
		}
		.yr-tag:hover {
			transform: none;
		}
		.yr-tag:hover svg {
			transform: none;
		}
	}
</style>
