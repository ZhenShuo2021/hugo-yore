{{- $summary := .Get "summary" | default "Details" -}}
{{- $open := .Get "open" | default false -}}
<details class="border-border bg-card yr-details my-4 rounded-lg border p-2 px-4" {{ if $open }}open{{ end }}>
	<summary>{{ $summary | markdownify }}</summary>
	<div class="yr-details-content py-2">
		{{- printf "\n\n%s\n\n" .Inner -}}
	</div>
</details>
{{- /**/ -}}
